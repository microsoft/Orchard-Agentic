apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestrator-config
  namespace: orchestrator
  labels:
    app: sandbox-orchestrator
data:
  # Service settings
  SERVICE_NAME: "sandbox-orchestrator"
  HOST: "0.0.0.0"
  PORT: "8000"
  
  # Kubernetes settings
  IN_CLUSTER: "true"
  NAMESPACE_PREFIX: "sbx-"
  ORCHESTRATOR_NAMESPACE: "orchestrator"
  SANDBOX_NAMESPACE: "sandbox-pods"
  
  # Sandbox settings
  DEFAULT_CPU: "4"
  DEFAULT_MEMORY: "16Gi"
  DEFAULT_WORKING_DIR: "/workspace"
  DEFAULT_BLOCK_NETWORK: "true"
  
  # Execution settings
  MAX_CONCURRENT_EXECS: "400"
  DEFAULT_TIMEOUT_SECONDS: "300"
  
  # K8s API throttling
  K8S_API_CONCURRENCY: "100"
  K8S_CONNECT_TIMEOUT: "10"
  K8S_API_TIMEOUT: "30"
  K8S_API_RETRIES: "3"
  K8S_API_POOL_SIZE: "100"
  K8S_EXEC_CONCURRENCY: "200"
  K8S_EXEC_RETRIES: "3"
  MAX_CONCURRENT_CREATES: "50"
  
  # Agent settings (in-pod FastAPI command server)
  AGENT_PORT: "9090"
  AGENT_CONNECT_TIMEOUT: "5"
  AGENT_POOL_SIZE: "500"
  AGENT_INJECTOR_IMAGE: "${ACR_NAME}.azurecr.io/sandbox-agent-injector:latest"

  # Sandbox tools — `codex` / `claude` CLIs available in every sandbox.
  # Mounted read-only straight from the image (no per-pod copy); switch
  # SANDBOX_TOOLS_VOLUME_MODE to "initcontainer" on clusters older than k8s 1.33.
  ENABLE_SANDBOX_TOOLS: "true"
  SANDBOX_TOOLS_IMAGE: "${ACR_NAME}.azurecr.io/sandbox-tools:latest"
  SANDBOX_TOOLS_VOLUME_MODE: "image"
  SANDBOX_TOOLS_MOUNT_PATH: "/opt/sandbox-tools"
  
  # Sandbox service endpoints — proxy HTTP/WebSocket to a user service running
  # inside a sandbox (OpenEnv env server, MCP server, dev server).
  # Off by default: it deliberately opens a hole in the sandbox boundary.
  ENABLE_SERVICE_ENDPOINTS: "false"
  SERVICE_PUBLIC_BASE_URL: ""
  SERVICE_ALLOW_INSECURE_HTTP: "false"
  SERVICE_TOKEN_TTL_SECONDS: "3600"
  MAX_SERVICES_PER_SANDBOX: "8"
  SERVICE_RESERVED_PORTS: ""
  SERVICE_TRAFFIC_REFRESHES_HEARTBEAT: "true"
  SERVICE_ACTIVE_HEARTBEAT_INTERVAL_SECONDS: "60"
  SERVICE_PROXY_TIMEOUT_SECONDS: "300"
  SERVICE_PROXY_HANDSHAKE_TIMEOUT_SECONDS: "15"
  SERVICE_PROXY_MAX_REQUEST_BYTES: "16777216"
  SERVICE_PROXY_MAX_MESSAGE_BYTES: "16777216"

  # Redis authentication is mandatory in the reference deployment. The
  # password comes from orchestrator-api-keys via envFrom.
  REDIS_REQUIRE_AUTH: "true"

  # TTL settings
  SANDBOX_TTL_HOURS: "2"
  ORPHAN_JOB_TTL_HOURS: "1"
  CLEANUP_INTERVAL_SECONDS: "900"
  
  # Heartbeat settings
  HEARTBEAT_TIMEOUT_SECONDS: "600"
  HEARTBEAT_CLEANUP_ENABLED: "true"
  
  # Logging
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
