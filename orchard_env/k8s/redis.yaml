---
# Redis deployment for sandbox state sharing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: orchestrator
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: ${ACR_NAME}.azurecr.io/redis:7-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orchestrator-api-keys
                  key: REDIS_PASSWORD
            # redis-cli reads this automatically, so probes authenticate
            # without putting the password in command arguments or logs.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: orchestrator-api-keys
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 4000m
              memory: 16Gi
            limits:
              cpu: 4000m
              memory: 16Gi
          command:
            - redis-server
          args:
            - --appendonly
            - "yes"
            - --maxmemory
            - 10gb
            - --maxmemory-policy
            - allkeys-lru
            - --requirepass
            - $(REDIS_PASSWORD)
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 3
      volumes:
        - name: redis-data
          emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: orchestrator
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
---
# Redis carries sandbox lifecycle, capability generations, and pod targets.
# Even a sandbox with block_network=false must never reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress-orchestrator-only
  namespace: orchestrator
  labels:
    app: redis
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sandbox-orchestrator
      ports:
        - protocol: TCP
          port: 6379
